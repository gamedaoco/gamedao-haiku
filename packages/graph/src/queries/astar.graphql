# Get all staking events for a user and a dapp in a period
query AstarDappStakingEvents ( $address:String, $period:Int, $dapp:String) {
	stake(where: {
		dapp_address: { _eq: $dapp },
		staker_address: { _eq: $address },
		period: { _eq: $period }
	}) {
		id
		dapp_address
		block_number
		amount
		period
		staker_address
		timestamp
	}
}
query AstarDappStakingEventsAggregate ( $dapp:String ) {
	stake_aggregate(where: {
		dapp_address: {_eq: $dapp}
	}) {

		nodes {
			block_number
			amount
			staker_address
		}
	}
}


subscription CurrentDappStake( $id:String, $period:Int ) {
  stakes_per_dap_and_period(where: {
    dapp_address: { _eq: $id }
    period: { _eq: $period }
  }) {
    stake_amount
    period
    reward_amount
  }
}

query AstarDappContent($id:String) {
  dAppContent(id:$id) {
    address
    creationTime
    iconUrl
    imagesUrl
    mainCategory
    name
    shortDescription
  }
}


subscription StakersPerDapp($dapp: String!) {
  stakers(where: {
	dapp_address: {_eq: $dapp}
}) {
    amount
    dapp_address
    id
    staker_address
  }
}

subscription StakesPerDappAndPeriod($dapp: String!, $period: Int!) {
  stakes_per_dap_and_period(
	where: {
		dapp_address: {_eq: $dapp},
		period: { _eq: $period }
	}
) {
    dapp_address
    id
    period
    reward_amount
    stake_amount
  }
}

subscription CurrentTVL {
  tvl_aggregated_daily(limit: 1, order_by:{block_number:desc}) {
    block_number
    tvl
    usd_price
    lockers_count
    id
  }
}

