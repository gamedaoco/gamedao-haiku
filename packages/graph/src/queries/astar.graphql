subscription StakingData (
	$dapp_address: String!,
	$staker_address: String!
){
  stake(where: {
	staker_address: {_eq: $staker_address},
	dapp_address: {_eq: $dapp_address}
}) {
    amount
    block_number
    dapp_address
    period
    staker_address
    timestamp
  }
}

query DappData (
	$dapp_address: String!,
	$staker_address: String!
){
  dapp(where: {id: {_eq: $staker_address}}) {
    dapp_id
    beneficiary
    owner
    id
  }
}

